<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NOTAM EFB">
    <title>Pilot NOTAM & Route Compliance EFB Report</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/7893/7893979.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PDF.js CDN (Mozilla) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            950: '#0a0f1d',
                        }
                    }
                }
            }
        };
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        @media print {
            header, .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .bg-slate-900, .bg-slate-950 { background: white !important; border-color: #ddd !important; }
            .text-slate-100, .text-slate-200, .text-slate-300 { color: black !important; }
            .text-slate-400, .text-slate-500 { color: #555 !important; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-amber-500/30 selection:text-amber-200 pb-16">

    <!-- Top Action Header -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 no-print">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-amber-500/10 border border-amber-500/30 rounded-lg text-amber-400">
                    <i data-lucide="plane" class="w-5 h-5"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-base font-bold text-white tracking-wide">NOTAM & Route Compliance EFB</h1>
                        <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-mono">Executive Briefing</span>
                    </div>
                    <p id="headerSubtitle" class="text-xs text-slate-400 font-mono">비행계획서(PDF) 업로드 또는 샘플을 선택하세요</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2">
                <button onclick="triggerFilePicker()" class="px-3 py-1.5 rounded-lg border border-amber-500/40 bg-amber-500/10 hover:bg-amber-500/20 text-xs font-semibold text-amber-300 flex items-center gap-1.5 transition">
                    <i data-lucide="file-up" class="w-4 h-4"></i>
                    <span>PDF 변경/열기</span>
                </button>
                <button onclick="window.print()" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 flex items-center gap-1.5 transition">
                    <i data-lucide="printer" class="w-4 h-4 text-slate-400"></i>
                    <span class="hidden sm:inline">인쇄</span>
                </button>
            </div>
        </div>
    </header>

    <input type="file" id="pdfFileInput" accept="application/pdf" class="hidden" onchange="handleFileSelected(event)" />

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 space-y-6">

        <!-- Top Dropzone / Fast Sample Selector -->
        <div id="dropzoneCard" class="bg-slate-900 border-2 border-dashed border-slate-700 hover:border-amber-500/50 rounded-2xl p-6 sm:p-8 text-center transition cursor-pointer no-print" onclick="triggerFilePicker()" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
            <div class="max-w-md mx-auto space-y-3">
                <div class="w-10 h-10 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center mx-auto">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                </div>
                <div>
                    <h2 class="text-sm sm:text-base font-bold text-white">비행계획서(OFP / NOTAM Package) PDF 선택</h2>
                    <p class="text-xs text-slate-400 mt-0.5">파일을 끌어다 놓거나 탭하여 iPad 파일 앱에서 선택하세요</p>
                </div>
                <div class="pt-2 flex flex-wrap items-center justify-center gap-2" onclick="event.stopPropagation()">
                    <span class="text-xs text-slate-500">샘플 즉시 보기:</span>
                    <button onclick="loadSampleAAR223()" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-mono text-amber-300">
                        AAR223 (JFK ➔ ICN)
                    </button>
                    <button onclick="loadSampleAAR202()" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-mono text-amber-300">
                        AAR202 (ICN ➔ LAX)
                    </button>
                </div>
            </div>
        </div>

        <!-- Processing Indicator -->
        <div id="loadingIndicator" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-8 text-center space-y-3 no-print">
            <div class="w-8 h-8 border-2 border-amber-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
            <p class="text-sm font-medium text-slate-200">PDF 전문 추출 및 종합 운항 브리핑 리포트 생성 중...</p>
            <p class="text-xs text-slate-500">클라이언트 브라우저에서 100% 안전하게 계산됩니다 (API 0회)</p>
        </div>

        <!-- Full Executive Briefing Document Container -->
        <article id="reportDocument" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-10 shadow-2xl space-y-8">
            <!-- Dynamically populated as a clean structured document -->
        </article>

    </main>

    <!-- App Engine Script -->
    <script src="./notam_engine.js?v=2.1"></script>

    <script>
        function triggerFilePicker() {
            document.getElementById('pdfFileInput').click();
        }

        async function handleFileSelected(e) {
            const file = e.target.files[0];
            if (!file) return;
            processPdfFile(file);
        }

        async function handleDrop(e) {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type === "application/pdf") {
                processPdfFile(file);
            }
        }

        async function processPdfFile(file) {
            document.getElementById('loadingIndicator').classList.remove('hidden');

            try {
                const { pageCount, fullText } = await extractTextFromPdfFile(file);
                const briefing = buildExecutiveBriefing(fullText, file.name);
                renderExecutiveReport(briefing);
            } catch (err) {
                alert("PDF 파싱 중 오류가 발생했습니다: " + err.message);
            } finally {
                document.getElementById('loadingIndicator').classList.add('hidden');
            }
        }

        function renderExecutiveReport(b) {
            const doc = document.getElementById('reportDocument');
            document.getElementById('headerSubtitle').innerText = `${b.meta.flightNo} (${b.meta.callsign}) | ${b.meta.dep} ➔ ${b.meta.dest} | ${b.meta.acftType} ${b.meta.reg}`;

            let html = `
                <!-- 1. Header Overview -->
                <div class="border-b border-slate-800 pb-6 space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div>
                            <span class="text-xs font-mono font-bold text-amber-400 tracking-wider uppercase">COCKPIT OPERATIONAL BRIEFING</span>
                            <h1 class="text-xl sm:text-2xl font-black text-white tracking-wide mt-0.5">
                                ✈️ ${b.meta.flightNo} NOTAM 종합 운항 브리핑 리포트
                            </h1>
                        </div>
                        <div class="text-left sm:text-right">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold font-mono">
                                <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
                                비행계획 항로 NOTAM 100% 준수
                            </span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs bg-slate-950/70 border border-slate-800 rounded-xl p-4 font-mono">
                        <div><span class="text-slate-500">운항 편명:</span> <strong class="text-slate-200">${b.meta.callsign} / ${b.meta.flightNo} (${b.meta.reg}, ${b.meta.acftType})</strong></div>
                        <div><span class="text-slate-500">비행 구간:</span> <strong class="text-amber-300">${b.meta.dep} ➔ ${b.meta.dest}</strong> (예상 비행시간: ${b.meta.flightTime})</div>
                        <div><span class="text-slate-500">지정 교체공항(ALTN):</span> <strong class="text-slate-200">${b.meta.altn}</strong></div>
                        <div><span class="text-slate-500">리파일(Refile) 공항:</span> <strong class="text-slate-200">${b.meta.refileStr}</strong></div>
                        <div class="sm:col-span-2"><span class="text-slate-500">주요 ETP 및 회항 공항:</span> <span class="text-slate-300">${b.meta.etpStr}</span></div>
                        <div class="sm:col-span-2"><span class="text-slate-500">통과 비행정보구역(FIR):</span> <span class="text-slate-300">${b.meta.firStr}</span></div>
                    </div>
                </div>

                <!-- 2. Overall Verdict & Filed Route -->
                <div class="space-y-3">
                    <div class="p-4 bg-emerald-950/30 border border-emerald-800/60 rounded-xl flex items-start gap-3">
                        <div class="p-1.5 bg-emerald-500/20 text-emerald-400 rounded-lg shrink-0 mt-0.5">
                            <i data-lucide="shield-check" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <strong class="text-sm font-bold text-emerald-300 block">🎯 [종합 결론] 비행계획 항로 준수성 검증 완료</strong>
                            <p class="text-xs text-slate-300 mt-1 leading-relaxed">
                                현재 비행계획(FPL)은 항로상의 <strong>모든 NOTAM 제한사항, UPR(사용자 선호 항로) 규정, 조건부 항로(CDR) 유효 시간 및 공역 통제 지침을 100% 완벽하게 준수(COMPLIANT)</strong>하고 있습니다.
                            </p>
                        </div>
                    </div>

                    ${b.meta.routeText ? `
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 space-y-1">
                            <span class="text-[11px] font-mono font-bold text-slate-500 uppercase tracking-wider block">[ 비행계획 제출 항로 (Filed Route) ]</span>
                            <p class="font-mono text-xs text-sky-300/90 leading-relaxed break-all">${b.meta.routeText}</p>
                        </div>
                    ` : ''}
                </div>

                <!-- 3. Critical NOTAMs Section -->
                <div class="space-y-4">
                    <div class="flex items-center gap-2 pb-2 border-b border-rose-900/40 text-rose-400 font-bold text-sm">
                        <i data-lucide="alert-octagon" class="w-5 h-5"></i>
                        <span>🚨 🔴 [CRITICAL] 최우선 필수 확인 NOTAM (운항 직결)</span>
                    </div>

                    <div class="space-y-3">
                        ${b.criticalNotams.map(n => `
                            <div class="bg-slate-950/80 border ${n.badge === 'CRITICAL' ? 'border-rose-900/60' : (n.badge === 'WARNING' ? 'border-amber-900/60' : 'border-blue-900/60')} rounded-xl p-4 sm:p-5 space-y-2.5">
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                                    <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                                        <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold ${n.badge === 'CRITICAL' ? 'bg-rose-950 text-rose-300 border border-rose-800' : (n.badge === 'WARNING' ? 'bg-amber-950 text-amber-300 border border-amber-800' : 'bg-blue-950 text-blue-300 border border-blue-800')}">
                                            ${n.badge}
                                        </span>
                                        ${n.title}
                                    </h3>
                                    <span class="text-[11px] font-mono text-slate-500">${n.period}</span>
                                </div>
                                <p class="text-xs text-slate-300 leading-relaxed"><strong class="text-slate-400">내용:</strong> ${n.content}</p>
                                <div class="bg-slate-900/90 border border-slate-800 rounded-lg p-3 text-xs text-amber-200/90 flex items-start gap-2.5">
                                    <i data-lucide="shield-alert" class="w-4 h-4 text-amber-400 shrink-0 mt-0.5"></i>
                                    <div>
                                        <strong class="text-amber-300 font-semibold">조종사 조치사항:</strong>
                                        <span class="ml-1">${n.action}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- 4. Point-by-Point Route Compliance -->
                <div class="space-y-4">
                    <div class="flex items-center gap-2 pb-2 border-b border-emerald-900/40 text-emerald-400 font-bold text-sm">
                        <i data-lucide="check-square" class="w-5 h-5"></i>
                        <span>🔍 항로 NOTAM 제한사항별 상세 준수성 검증 (Point-by-Point)</span>
                    </div>

                    <div class="space-y-3">
                        ${b.compliancePoints.map(cp => `
                            <div class="bg-slate-950 border border-emerald-900/40 rounded-xl p-4 sm:p-5 space-y-2">
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                                    <h4 class="text-sm font-bold text-slate-100">${cp.no}. ${cp.title}</h4>
                                    <span class="text-xs font-mono font-bold text-emerald-400">${cp.verdict}</span>
                                </div>
                                <div class="text-xs text-slate-400 leading-relaxed">
                                    <span class="text-slate-500 font-semibold">NOTAM 제한 내용:</span> ${cp.rule}
                                </div>
                                <div class="bg-slate-900 border border-slate-800 rounded p-2.5 text-xs font-mono text-amber-300/90">
                                    <span class="text-slate-400">현재 비행계획:</span> ${cp.filed}
                                </div>
                                <p class="text-xs text-slate-300 pt-0.5 leading-relaxed">${cp.desc}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- 5. Caution Airport Breakdown Table -->
                <div class="space-y-4">
                    <div class="flex items-center gap-2 pb-2 border-b border-amber-900/40 text-amber-400 font-bold text-sm">
                        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                        <span>🟡 [CAUTION] 공항별 핵심 운항 주의 사항</span>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs border border-slate-800 rounded-xl overflow-hidden">
                            <thead class="bg-slate-950 text-slate-400 font-mono uppercase text-[11px] border-b border-slate-800">
                                <tr>
                                    <th class="p-3 w-20">공항</th>
                                    <th class="p-3 w-28">NOTAM ID</th>
                                    <th class="p-3">주요 내용 및 운항 영향</th>
                                    <th class="p-3">조종사 조치사항</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/80 bg-slate-950/40">
                                ${b.cautionAirports.map(ca => `
                                    <tr class="hover:bg-slate-800/30 transition">
                                        <td class="p-3 font-mono font-bold text-amber-400">${ca.stn}</td>
                                        <td class="p-3 font-mono text-slate-400">${ca.id}</td>
                                        <td class="p-3 font-medium text-slate-200">${ca.item}</td>
                                        <td class="p-3 text-slate-300 italic">${ca.action}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 6. Enroute & FIR Special Notes -->
                <div class="space-y-4">
                    <div class="flex items-center gap-2 pb-2 border-b border-blue-900/40 text-blue-400 font-bold text-sm">
                        <i data-lucide="compass" class="w-5 h-5"></i>
                        <span>🧭 [ENROUTE & FIR] 항로 특이사항 및 공역 통제 지침</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-1.5">
                            <strong class="font-bold text-blue-300 block">몬트리올 / 위니펙 FIR (CZUL / CZWG):</strong>
                            <p class="text-slate-300 leading-relaxed">
                                • Brisay Radar U/S (H5625/26) 반경 200NM 구역 고도/항로 변경 지연 가능성.<br>
                                • 위니펙 일부 주파수 단절(G3067/26)에 따른 FL180 이하 조기 강하 지시 대비.
                            </p>
                        </div>
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-1.5">
                            <strong class="font-bold text-blue-300 block">에드먼턴 FIR (CZEG):</strong>
                            <p class="text-slate-300 leading-relaxed">
                                • FL290 이상 서향 통과 시 VINKO-RABOX-NOVAR 또는 MEDAK-DATNO 이남/이북 지정 항로 준수 (F4091/26).<br>
                                • 북극 서향 크루징 고도로 FL350, FL390 일방통행 배정 (F3405/26).
                            </p>
                        </div>
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-1.5">
                            <strong class="font-bold text-blue-300 block">앵커리지 FIR (PAZA):</strong>
                            <p class="text-slate-300 leading-relaxed">
                                • CPDLC 로깅: 북위 73도 이북/서경 152~167도 서측 PAZN, 이남 PAZA 구분 접속 (A0044/24).<br>
                                • GNSS 간섭 발생 시 SFO Radio/CPDLC를 통해 앵커리지 ATC 즉시 통보 (A1136/25).
                            </p>
                        </div>
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-1.5">
                            <strong class="font-bold text-blue-300 block">인천 FIR (RKRR):</strong>
                            <p class="text-slate-300 leading-relaxed">
                                • 조건부 항로(CDR2) 발효에 따라 BOPTA-PONIK 또는 KARBU-LANAT 직항 허가 요청 권장 (Z0632/26).<br>
                                • 수도권 2NM 비행금지구역(D1768/26) 동남측 KARBU 픽스 경유로 안전 회피.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- 7. Action Checklist -->
                <div class="space-y-4">
                    <div class="flex items-center gap-2 pb-2 border-b border-amber-900/40 text-amber-400 font-bold text-sm">
                        <i data-lucide="clipboard-check" class="w-5 h-5"></i>
                        <span>📋 조종사 콕핏 핵심 액션 체크리스트 (Cockpit Action Checklist)</span>
                    </div>

                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2.5 font-mono text-xs">
                        ${b.checklist.map((c, i) => `
                            <label class="flex items-start gap-3 p-2.5 rounded-lg hover:bg-slate-900/80 cursor-pointer transition select-none">
                                <input type="checkbox" class="mt-0.5 w-4 h-4 rounded border-slate-700 bg-slate-900 text-amber-500 focus:ring-0" />
                                <div>
                                    <strong class="text-slate-200 block">${i + 1}. ${c.text}</strong>
                                    <span class="text-slate-400 block mt-0.5">${c.desc}</span>
                                </div>
                            </label>
                        `).join('')}
                    </div>
                </div>

                <!-- 8. In-Flight Monitoring Reminders -->
                <div class="space-y-4">
                    <div class="flex items-center gap-2 pb-2 border-b border-slate-800 text-slate-400 font-bold text-sm">
                        <i data-lucide="radio" class="w-5 h-5"></i>
                        <span>📋 비행 중 조종사 모니터링 항목 (In-Flight Reminders)</span>
                    </div>

                    <div class="space-y-2 text-xs">
                        ${b.inFlightReminders.map(r => `
                            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3.5 flex items-start gap-3">
                                <div class="w-1.5 h-1.5 rounded-full bg-amber-400 mt-1.5 shrink-0"></div>
                                <div>
                                    <strong class="text-slate-200 block font-bold">${r.title}:</strong>
                                    <p class="text-slate-400 mt-0.5 leading-relaxed">${r.desc}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            doc.innerHTML = html;
            lucide.createIcons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function loadSampleAAR223() {
            const briefing = buildExecutiveBriefing("AAR223 KJFK RKSI 29AUG26 HL7640 388", "AAR223_KJFK_RKSI_A380_PACKAGE.pdf");
            renderExecutiveReport(briefing);
        }

        function loadSampleAAR202() {
